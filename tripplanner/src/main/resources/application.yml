spring:
  application:
    name: tripplanner
  
  # 🐬 MySQL Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/trip?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:1234}
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  
  jpa: 
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
  
  # ⚡ Redis Configuration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  
server:
  port: 8090

router9:
  api:
    key: ${9ROUTER_API_KEY:}
    url: http://localhost:20128/v1/chat/completions

ai-service:
  url: http://localhost:8000/ai

# 🛡️ App JWT Security Configuration
app:
  jwt:
    secret: ${JWT_ACCESS_SECRET:very-long-secret-key-that-must-be-at-least-32-characters-long-access-key}
    expiration: ${JWT_ACCESS_EXPIRATION:600000} # 10 minutes (600,000 ms)
  refresh:
    secret: ${JWT_REFRESH_SECRET:another-very-long-secret-key-that-must-be-at-least-32-characters-long-refresh-key}
    expiration: ${JWT_REFRESH_EXPIRATION:2592000000} # 30 days (2,592,000,000 ms)
