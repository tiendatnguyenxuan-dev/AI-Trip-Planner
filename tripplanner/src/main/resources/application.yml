spring:
  application:
    name: tripplanner

  # 🐬 MySQL DataSource + HikariCP Connection Pool
  datasource:
    url: jdbc:mysql://localhost:3306/trip?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:1234}
    hikari:
      # Sized for a typical 4-core development machine (2 × cores + 1 spare)
      maximum-pool-size: 10
      # Keep at least 5 connections warm — avoids cold-start latency spikes
      minimum-idle: 5
      # 20 s: fail fast when all connections are busy; don't block the request thread
      connection-timeout: 20000
      # 5 min idle before a connection is retired — keeps the pool fresh
      idle-timeout: 300000
      # 20 min lifetime — safely below MySQL default wait_timeout (8 h)
      max-lifetime: 1200000
      pool-name: TripPlannerHikariPool

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  # 🗃️ JPA — schema validated, NOT auto-updated (Flyway owns schema now)
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
        # Batch inserts/updates for better throughput
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # 🗃 Flyway — versioned schema migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: false
    clean-on-validation-error: true

  # ⚡ Redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

server:
  port: 8090

router9:
  api:
    key: ${9ROUTER_API_KEY:}
    url: http://localhost:20128/v1/chat/completions

ai-service:
  url: http://localhost:8000/ai

# 🛡️ App JWT Security Configuration
app:
  jwt:
    secret: ${JWT_ACCESS_SECRET:very-long-secret-key-that-must-be-at-least-32-characters-long-access-key}
    expiration: ${JWT_ACCESS_EXPIRATION:600000} # 10 minutes (600,000 ms)
  refresh:
    secret: ${JWT_REFRESH_SECRET:another-very-long-secret-key-that-must-be-at-least-32-characters-long-refresh-key}
    expiration: ${JWT_REFRESH_EXPIRATION:2592000000} # 30 days (2,592,000,000 ms)
